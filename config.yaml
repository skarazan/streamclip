# identity: drives selection rubric, few-shot anchors, title formula
streamer_name: "CaseOh"
persona: "caseoh"

# clipfarm config

channel:
  # Twitch channel to pull VODs from
  twitch_url: "https://www.twitch.tv/caseoh_"

clips:
  count: 10             # shorts per run. Marginal clip = $0.011 (transcription
                        # and scoring are per-VOD fixed), and no signal ranks
                        # better than ~1.25x over chance, so surfacing more is
                        # the only reliable lever on usable output. See
                        # research/2026-08-03-signal-ceiling.md and BUSINESS.md.
  min_length: 16        # seconds
  max_length: 45        # duration is not the enemy; dead/irrelevant time is
  smart_cut: true         # LLM condense redundant talking when a clip stays long after silence-cut
  smart_cut_target: 28    # aim length for smart-cut (seconds)
  min_gap_minutes: 20   # spread the batch across the stream, not one section
  analysis_quality: "best[height<=360]" # cheap candidate gate; never shipped
  quality: "best[height<=1080]"
  # CPU-only bounded overlap. These caps improve utilization without creating
  # extra Modal containers or an unbounded compute bill.
  download_workers: 3
  # Fetch 6s of the lowest rendition before transcribing/scoring. Twitch
  # refuses media to some egress IPs; without this the job pays a full LLM
  # scoring pass before discovering it can't download a single frame.
  media_precheck: true
  render_workers: 2

# Whisper transcription (runs locally, no API cost)
transcribe:
  # provider groq = whisper-large-v3-turbo via API (~200x realtime, ~$0.13
  # per 6h VOD, word timestamps) -> NO GPU anywhere in the pipeline.
  # `model`/`caption_model` are the local faster-whisper fallback chain:
  # cheap whole-VOD model for moment selection, big model only on the ~90s
  # of chosen segments for burned captions (base.en heard "BANG" as "BANK").
  provider: "groq"
  model: "base.en"
  caption_model: "distil-large-v3"
  caption_workers: 3
  compute_type: "int8"

# LLM moment scoring. Falls back to audio-loudness-only picking if no key.
# Claude models need ANTHROPIC_API_KEY; gpt-* models need OPENAI_API_KEY.
# Options, best picks -> cheapest:
#   claude-opus-4-8   ~$0.50-1 per stream, best moments/titles
#   claude-haiku-4-5  ~$0.10 per stream
#   gpt-5-mini / gpt-4o-mini   few cents per stream
llm:
  # Providers:
  #   claude-code           -> local claude CLI on a Claude subscription ($0)
  #   claude-* models       -> Anthropic API (ANTHROPIC_API_KEY)
  #   gpt-* models          -> OpenAI API (OPENAI_API_KEY)
  #   base_url set          -> ANY OpenAI-compatible endpoint, e.g. FREE tiers:
  #     Groq:       base_url: https://api.groq.com/openai/v1        api_key_env: GROQ_API_KEY
  #     Gemini:     base_url: https://generativelanguage.googleapis.com/v1beta/openai/   api_key_env: GEMINI_API_KEY
  #     OpenRouter: base_url: https://openrouter.ai/api/v1          api_key_env: OPENROUTER_API_KEY  (":free" models)
  # benchmark 2026-07-04 (blind Claude judging): gpt-5-mini best picks/hooks.
  # ~$0.045/stream. scout = fast free fallback, gemini third (free-tier flaky).
  # PAID primary (2026-07-25). A/B with free gemini fronting was attempted
  # 2026-07-26 and VOIDED: both gemini models 429'd instantly under real
  # Tier-C load (46 chunks) and every call fell through to gpt-5-mini, adding
  # ~20 min of retry latency for nothing. Free tiers cannot front production
  # jobs; a real gemini comparison needs paid Gemini billing.
  model: "gpt-5-mini"
  fallback_models: ["gemini-3.5-flash", "gemini-3.6-flash", "llama-3.3-70b-versatile"]
  base_url: null
  api_key_env: "OPENAI_API_KEY"
  chunk_minutes: 8      # small chunks: free-tier TPM limits
  # Hidden-reasoning budget for CHUNK SCORING only (the editor/judge pass keeps
  # the model default). null = provider default. Measured on one real 8-min
  # chunk of VOD 2813202773 with gpt-5-mini:
  #   default  1963 out tok (1792 reasoning = 91%)  23.5s  $0.0046
  #   low      1115 out tok ( 704 reasoning)        12.7s  $0.0029
  #   minimal  1038 out tok (   0 reasoning)        11.7s  $0.0027
  # `minimal` returned MORE moments at LOWER top scores — less selective, and
  # extra candidates cost segment downloads and renders downstream. `low` kept
  # the highest-scoring pick of the three. n=1 chunk: A/B a full Tier-C VOD
  # against progress.llm_usage before making a non-null value the default.
  # Enabled 2026-07-25 on production evidence, not the bench above: a real 5h
  # job spent 112,576 of 123,905 output tokens (91%) on hidden reasoning, cost
  # $0.27 for scoring alone, and timed out 3 of 38 chunks. `low` cuts latency
  # ~46% (which is what fixes the timeouts) and cost ~37%. The editor/judge
  # pass is untouched and keeps full reasoning — that call is the quality gate.
  # If selection quality drops, this is the first thing to revert.
  reasoning_effort: "low"

# Visual style — matched to @CheeseDipClips
style:
  # Dashboard-selectable packaging template. These change how a verified
  # story is presented; they never bypass story/arc quality gates.
  title_strategy: "curiosity"  # curiosity | stakes | reaction | quote
  opening_effect: "punch_zoom" # clean | punch_zoom | impact | drift_pan

  # split = facecam auto-detected and stacked on top of gameplay.
  # Falls back to full-frame crop when no face is found in a segment.
  layout: "split"       # split | full
  split_top: 0.42       # fraction of the short occupied by the cam pane
  crop: "center"        # full-frame mode: which part of 16:9 frame to keep

  # speech captions: plain white bold, 1-2 words, as-spoken case
  font: "Arial Rounded MT Bold"
  font_size: 74
  primary_color: "&H00FFFFFF"    # ASS BGR: white
  highlight_color: "&H00FFFFFF"  # active word same color, just pops in size
  outline_color: "&H00000000"
  outline: 6
  caption_pos: 0.72
  words_per_line: 2
  uppercase: false

  # hook title: persistent line upper-middle, one keyword colored
  hook:
    font: "Arial Rounded MT Bold"
    font_size: 84
    pos: 0.30
    color: "&H00FFFFFF"
    keyword_colors: ["&H0035D622", "&H002424FF"]  # green, red — picked per clip
    outline: 7

  watermark:
    text: ""
    font: "Marker Felt"
    font_size: 48
    color: "&H60FFFFFF"   # semi-transparent white

output:
  dir: "out"
  brand: ""   # channel handle watermark, e.g. "@YourClips" — empty = off
  description_template: |
    {title} #caseoh #caseohgames #shorts #gaming #funny

    Clipped from CaseOh's stream. Full VOD on his channel.

safety:
  min_free_gb: 2        # abort if less free disk than this
