# identity: drives selection rubric, few-shot anchors, title formula
streamer_name: "CaseOh"
persona: "caseoh"

# clipfarm config

channel:
  # Twitch channel to pull VODs from
  twitch_url: "https://www.twitch.tv/caseoh_"

clips:
  count: 3              # shorts to produce per run
  min_length: 12        # seconds
  max_length: 28        # short clips = retention; hard cap
  min_gap_minutes: 20   # spread the batch across the stream, not one section
  quality: "best[height<=1080]"

# Whisper transcription (runs locally, no API cost)
transcribe:
  # provider groq = whisper-large-v3-turbo via API (~200x realtime, ~$0.13
  # per 6h VOD, word timestamps) -> NO GPU anywhere in the pipeline.
  # `model`/`caption_model` are the local faster-whisper fallback chain:
  # cheap whole-VOD model for moment selection, big model only on the ~90s
  # of chosen segments for burned captions (base.en heard "BANG" as "BANK").
  provider: "groq"
  model: "base.en"
  caption_model: "distil-large-v3"
  compute_type: "int8"

# LLM moment scoring. Falls back to audio-loudness-only picking if no key.
# Claude models need ANTHROPIC_API_KEY; gpt-* models need OPENAI_API_KEY.
# Options, best picks -> cheapest:
#   claude-opus-4-8   ~$0.50-1 per stream, best moments/titles
#   claude-haiku-4-5  ~$0.10 per stream
#   gpt-5-mini / gpt-4o-mini   few cents per stream
llm:
  # Providers:
  #   claude-code           -> local claude CLI on a Claude subscription ($0)
  #   claude-* models       -> Anthropic API (ANTHROPIC_API_KEY)
  #   gpt-* models          -> OpenAI API (OPENAI_API_KEY)
  #   base_url set          -> ANY OpenAI-compatible endpoint, e.g. FREE tiers:
  #     Groq:       base_url: https://api.groq.com/openai/v1        api_key_env: GROQ_API_KEY
  #     Gemini:     base_url: https://generativelanguage.googleapis.com/v1beta/openai/   api_key_env: GEMINI_API_KEY
  #     OpenRouter: base_url: https://openrouter.ai/api/v1          api_key_env: OPENROUTER_API_KEY  (":free" models)
  # benchmark 2026-07-04 (blind Claude judging): gpt-5-mini best picks/hooks.
  # ~$0.045/stream. scout = fast free fallback, gemini third (free-tier flaky).
  model: "gpt-5-mini"
  fallback_models: ["meta-llama/llama-4-scout-17b-16e-instruct", "gemini-3.5-flash", "llama-3.3-70b-versatile"]
  base_url: null
  api_key_env: "OPENAI_API_KEY"
  chunk_minutes: 8      # small chunks: free-tier TPM limits

# Visual style — matched to @CheeseDipClips
style:
  # split = facecam auto-detected and stacked on top of gameplay.
  # Falls back to full-frame crop when no face is found in a segment.
  layout: "split"       # split | full
  split_top: 0.42       # fraction of the short occupied by the cam pane
  crop: "center"        # full-frame mode: which part of 16:9 frame to keep

  # speech captions: plain white bold, 1-2 words, as-spoken case
  font: "Arial Rounded MT Bold"
  font_size: 74
  primary_color: "&H00FFFFFF"    # ASS BGR: white
  highlight_color: "&H00FFFFFF"  # active word same color, just pops in size
  outline_color: "&H00000000"
  outline: 6
  caption_pos: 0.72
  words_per_line: 2
  uppercase: false

  # hook title: persistent line upper-middle, one keyword colored
  hook:
    font: "Arial Rounded MT Bold"
    font_size: 84
    pos: 0.30
    color: "&H00FFFFFF"
    keyword_colors: ["&H0035D622", "&H002424FF"]  # green, red — picked per clip
    outline: 7

  watermark:
    text: ""
    font: "Marker Felt"
    font_size: 48
    color: "&H60FFFFFF"   # semi-transparent white

output:
  dir: "out"
  brand: ""   # channel handle watermark, e.g. "@YourClips" — empty = off
  description_template: |
    {title} #caseoh #caseohgames #shorts #gaming #funny

    Clipped from CaseOh's stream. Full VOD on his channel.

safety:
  min_free_gb: 2        # abort if less free disk than this
